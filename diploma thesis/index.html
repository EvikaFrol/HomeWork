<!doctype html>
<html class="page" lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="./css/index.css" />
		<link
			rel="shortcut icon"
			href="./icons/icons8-apple-inc-office-l-32.ico"
			type="image/x-icon"
		/>
		<title>California</title>
	</head>
	<body class="page__body">
		<header class="header hearder--fixed">
			<div class="container header__container">
				<a href="#" class="logo header__logo">
					<img
						class="logo__img"
						src="./icons/logo-icon.svg"
						width="170"
						height="21"
						alt="logo California"
					/>
				</a>
				<nav class="menu header__menu">
					<ul class="menu__list">
						<li class="menu__item">
							<a href="#all products" class="menu__link">ALL PRODUCTS</a>
						</li>
						<li class="menu__item">
							<a href="#Solutions" class="menu__link">SOLUTIONS</a>
						</li>
						<li class="menu__item">
							<a href="#ABOUT" class="menu__link">ABOUT</a>
						</li>
						<li class="menu__item">
							<a href="#Support" class="menu__link">SUPPORT</a>
						</li>
					</ul>
				</nav>
				<div class="header__actions">
					<button class="header__actions-button">
						<a href="#" title="search" aria-label="search">
							<img
								class="header__actions-icon"
								src="./icons/search.svg"
								width="24px"
								height="24px"
								alt="search"
							/>
						</a>
					</button>
					<button class="header__actions-button">
						<a href="#" title="basket" aria-label="basket">
							<img
								class="header__actions-icon"
								src="./icons/basket.svg"
								width="24px"
								height="24px"
								alt="basket"
							/>
						</a>
					</button>
				</div>
			</div>
		</header>
		<main class="main">
			<section class="hero">
				<div class="container hero__container">
					<header class="hero__header">
						<h1 class="hero__title">
							The new phones are <br />
							here take a look.
						</h1>
						<p class="hero__text">
							Lorem ipsum dolor sit amet, consectetur adipiscing elit.
							Scelerisque in est <br />
							dui, aliquam, tempor. Faucibus morbi turpis.
						</p>
					</header>
					<img
						class="hero__img"
						src="./images/phone-1.png"
						alt="three light-blue iPhones"
					/>
					<footer class="hero__footer"></footer>
					<a href="#" class="hero__Explore">Explore</a>
				</div>
			</section>
		</main>
	</body>
</html>

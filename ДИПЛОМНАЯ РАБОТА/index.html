<!doctype html>
<html class="page" lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="./css/index.css" />
		<link
			rel="shortcut icon"
			href="./icons/icons8-apple-inc-office-l-32.ico"
			type="image/x-icon"
		/>
		<title>California</title>
	</head>
	<body class="page__body">
		<header class="header hearder--fixed">
			<div class="container header__container--1">
				<a href="#" class="logo header__logo">
					<img
						class="logo__img"
						src="./icons/logo-icon.svg"
						width="170"
						height="21"
						alt="logo California"
					/>
				</a>
				<nav class="menu header__menu">
					<ul class="menu__list">
						<li class="menu__item">
							<a href="#all products" class="menu__link">ALL PRODUCTS</a>
						</li>
						<div>
							<details>
								<summary>
									<ul class="article-list">
										<a href="#Solutions" class="menu__link">SOLUTIONS</a>
									</ul>
								</summary>
								<div class="faq__container">
									<li class="article__item">
										<a
											href="#Shop our latest offers and categories"
											class="menu__link"
											>Shop our latest offers and categories</a
										>
									</li>
									<li class="article__item">
										<a href="#Save on our most selled items" class="menu__link"
											>Save on our most selled items</a
										>
									</li>
									<li class="article__item">
										<a href="#See the best around here" class="menu__link"
											>See the best around here</a
										>
									</li>
									<li class="article__item">
										<a href="#Ideas have a place here" class="menu__link"
											>Ideas have a place here</a
										>
									</li>
									<li class="article__item">
										<a href="#Looking for anything else?" class="menu__link"
											>Looking for anything else?</a
										>
									</li>
								</div>
							</details>
						</div>
						<li class="menu__item">
							<a href="#ABOUT" class="menu__link">ABOUT</a>
						</li>
						<li class="menu__item">
							<a href="#Support" class="menu__link">SUPPORT</a>
						</li>
					</ul>
				</nav>
				<div class="header__controls">
					<button
						class="header__actions-button"
						title="search"
						aria-label="search"
					>
						<svg width="20" height="20">
							<use
								class="header__actions-icon"
								href="./icons/sprite.svg#search"
							></use>
						</svg>
					</button>
					<button
						class="header__actions-button"
						title="basket"
						aria-label="basket"
					>
						<svg width="20" height="20">
							<use
								class="header__actions-icon"
								href="./icons/sprite.svg#cart"
							></use>
						</svg>
					</button>
				</div>
			</div>
		</header>
	</body>
</html>
